# .github/workflows/backend-ci.yaml

name: Backend-CI

on:
  push:
    branches: [ "main" ]
    paths:
      - 'backend/**'
      - 'tests/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/**'

  pull_request:
    branches: [ "main" ]
    paths:
      - 'backend/**'
      - 'tests/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/**'

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db
      DATABASE_URL: postgresql1://postgres:postgres@localhost:5432/test_db
      JWT_SECRET_KEY: ci-test-secret
      JWT_ALGORITHM: HS256
      JWT_EXPIRATION_DAYS: "7"

    steps:
      - name: Setup repository
        uses: actions/checkout@v4

      - name: Setup uv and python
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: "true"
          python-version: "3.12"

      - name: Check uv version
        run: uv --version

      - name: Dependencies
        run: uv sync

      - name: Lint
        run: uv run ruff check backend/

      - name: Tests
        run: uv run pytest
